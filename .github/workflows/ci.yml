name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # Sonar needs full history for blame and new-code detection

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "10.0.x"

      - name: Install 7-Zip
        run: sudo apt-get install -y p7zip-full

      - name: Install dotnet-sonarscanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Restore
        run: dotnet restore RomForge.slnx

      # Enforcement build, deliberately outside the Sonar wrap. `begin` injects
      # targets that force TreatWarningsAsErrors=false so Sonar findings reach
      # the quality gate instead of breaking the build — which would also
      # silently disable our own analyzer enforcement for the whole CI run.
      # This build keeps -warnaserror meaningful; the wrapped one below does the
      # analysis.
      - name: Build (warnings-as-errors)
        run: dotnet build RomForge.slnx --no-restore --configuration Release -warnaserror

      # C# is analysed by SonarScanner for .NET, which hooks the MSBuild
      # compilation — the generic CLI scanner cannot see it. Everything below
      # therefore has to happen between `begin` and `end`. All settings live
      # here as /d: flags; a sonar-project.properties file is not read by this
      # scanner and makes `end` fail outright.
      - name: Sonar begin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_PERSONAL }}
        run: >
          dotnet sonarscanner begin
          /k:"Duracell1989_RomForge"
          /o:"duracell1989"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.sourceEncoding="UTF-8"
          /d:sonar.exclusions="**/*.ico,**/*.icns,**/*.png,**/*.svg,**/*.old"
          /d:sonar.test.exclusions="**/*.ico,**/*.icns,**/*.png,**/*.svg,**/*.old"
          /d:sonar.coverage.exclusions="**/App.axaml.cs,**/Program.cs,**/ViewLocator.cs,**/AvaloniaUserNotifier.cs,**/AvaloniaFileDialogService.cs,**/AvaloniaUiDispatcher.cs,**/AvaloniaAppLifetime.cs,**/Views/*.axaml.cs"
          /d:sonar.cs.cobertura.reportsPaths="artifacts/coverage/**/coverage.cobertura.xml"

      # --no-incremental: the scanner only sees code the compiler actually
      # recompiles, and the build above already made every project up to date,
      # so without this the whole solution would drop out of analysis.
      - name: Build (analysis)
        run: dotnet build RomForge.slnx --no-restore --no-incremental --configuration Release

      - name: Test with coverage
        run: dotnet test RomForge.slnx --no-build --configuration Release --collect:"XPlat Code Coverage" --settings coverage.runsettings --results-directory artifacts/coverage

      - name: Sonar end
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_PERSONAL }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Check coverage threshold
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          export PATH="$PATH:$HOME/.dotnet/tools"
          reportgenerator \
            "-reports:artifacts/coverage/**/coverage.cobertura.xml" \
            "-targetdir:artifacts/coverage/merged" \
            "-reporttypes:Cobertura" \
            "-assemblyfilters:+RomForge.Core;-RomForge.UI"
          python3 << 'EOF'
          import xml.etree.ElementTree as ET, sys
          root = ET.parse('artifacts/coverage/merged/Cobertura.xml').getroot()
          pct = float(root.get('line-rate', 0)) * 100
          print(f'Line coverage: {pct:.1f}%')
          if pct < 60:
              print(f'FAIL: {pct:.1f}% is below the 60% minimum threshold')
              sys.exit(1)
          EOF

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: artifacts/coverage/
          if-no-files-found: warn
